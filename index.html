<html lang="ko">
<head>
<meta charset="UTF-8" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

<meta http-equiv="Content-Security-Policy"
content="default-src 'self' data: gap:;
base-uri 'self';
object-src 'none';
form-action 'self';
connect-src 'self' https://api.real-debrid.com https://raw.githubusercontent.com https://cloud.umami.is https://gateway.umami.is;

script-src 'self' 'unsafe-inline' https://cloud.umami.is;">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" integrity="sha384-HtMZLkYo+pR5/u7zCzXxMJP6QoNnQJt1qkHM0EaOPvGDIzaVZbmYr/TlvUZ/sKAg" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" />
<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --line:#e5e7eb; --ink:#111827; --muted:#6b7280;
    --blue:#2563eb; --blue-d:#1d4ed8; --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.05);
    --topcard:170px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 34px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .top h1{font-size:17px;margin:0;letter-spacing:-.2px}
  .tag{font-size:11px;color:#6b7280;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

  /* 접기 헤더(좁은 화면 전용) */
  .c-head{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;
    font-weight:700;font-size:12.5px;user-select:none}
  .c-head .c-right{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:#9ca3af}
  .c-head .caret{width:14px;height:14px;color:#9ca3af;transition:.15s}
  .card.collapsed .c-head .caret{transform:rotate(-90deg)}

  /* 상단 카드(좌우 같은 높이) */
  .folders-card{height:var(--topcard);padding:12px 12px 10px;display:flex;flex-direction:column;flex:0 0 auto}
  .up{height:var(--topcard);padding:14px;display:flex;flex-direction:column;flex:0 0 auto}

  .folders{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;scrollbar-width:thin;cursor:grab;user-select:none;flex:1 1 auto;min-height:0;align-items:flex-start}
  .folders.dragging{cursor:grabbing}
  .folders::-webkit-scrollbar{height:8px}
  .folders::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:999px}
  .folder{flex:0 0 auto;width:104px;height:92px;border:1px solid var(--line);border-radius:10px;background:#fff;
    display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px;cursor:pointer;transition:.15s;position:relative}
  .folder:hover{border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 2px 8px rgba(16,24,40,.07)}
  .folder.sel{border-color:currentColor;box-shadow:0 0 0 2px color-mix(in srgb, currentColor 22%, transparent)}
  .folder .frow{display:flex;align-items:flex-start;justify-content:space-between}
  .folder .ico{width:22px;height:22px;color:currentColor}
  .folder .cnt{font-size:11px;color:#9ca3af;font-variant-numeric:tabular-nums}
  .folder .nm{font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .folder .nm input{width:100%;font:inherit;border:1px solid #93c5fd;border-radius:5px;padding:1px 4px;outline:none;background:#fff}

  .fa-actions{display:flex;gap:8px;padding:4px 2px 0;flex-wrap:wrap;flex:0 0 auto}
  .btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:#374151;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f9fafb;border-color:#d1d5db}
  .btn svg{width:15px;height:15px}
  .btn.active{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}
  .tag:empty{display:none}
  .fx-hint{flex:1 1 100%;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px;height:88px}

  /* 목록 */
  .list-card{flex:1 1 auto;display:flex;flex-direction:column;min-height:320px}
  .list-head{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:50px;
    color:#111827;background:#f9fafb;border-bottom:1px solid var(--line);transition:background .5s,color .3s;flex:0 0 auto}
  .list-head.on-folder{color:#fff;border-bottom-color:transparent}
  .lt{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 auto}
  .lt h2{margin:0;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.14)}
  .lt .sub{font-size:11.5px;font-weight:700;opacity:.9;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.12)}
  .lt-sel{font-size:11px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;text-shadow:0 1px 1px rgba(0,0,0,.12)}

  .lt-tools{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .sep{width:1px;height:18px;background:currentColor;opacity:.28;margin:0 3px}
  .hbtn{position:relative;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;cursor:pointer;
    background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);color:#1f2937;
    box-shadow:0 1px 3px rgba(16,24,40,.28);transition:.14s}
  .hbtn svg{width:16px;height:16px;stroke-width:2.3}
  .hbtn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 2px 6px rgba(16,24,40,.32)}
  .hbtn.disabled{opacity:.45;box-shadow:none}
  .hbtn.disabled:hover{transform:none;background:rgba(255,255,255,.94)}
  .list-head:not(.on-folder) .hbtn{background:#fff;border-color:var(--line);color:#6b7280;box-shadow:none}
  .list-head:not(.on-folder) .hbtn:hover{background:#f3f4f6;border-color:#d1d5db;color:#111827}

  .hbtn::after{content:attr(data-tip);position:absolute;top:34px;left:50%;transform:translateX(-50%) translateY(-2px);
    background:rgba(17,24,39,.94);color:#fff;font-size:11px;font-weight:600;line-height:1.2;padding:5px 8px;border-radius:6px;
    white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:30}
  .hbtn::before{content:"";position:absolute;top:29px;left:50%;transform:translateX(-50%);border:4px solid transparent;
    border-bottom-color:rgba(17,24,39,.94);opacity:0;transition:.12s;z-index:30}
  .hbtn:hover::after,.hbtn:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}
  .hbtn:hover::before,.hbtn:focus-visible::before{opacity:1}
  .hbtn:nth-last-child(-n+2)::after{left:auto;right:0;transform:translateY(-2px)}
  .hbtn:nth-last-child(-n+2):hover::after{transform:translateY(0)}
  .hbtn:nth-last-child(-n+2)::before{left:auto;right:10px;transform:none}

  .rows{flex:1 1 auto;overflow:auto;min-height:0}
  .row{padding:10px 14px;border-bottom:1px solid #f1f2f4;display:flex;gap:10px;align-items:center;cursor:pointer;border-left:3px solid transparent}
  .row:last-child{border-bottom:0}
  .row:hover{background:#fbfcfd}
  .row.picked{background:#eff6ff;border-left-color:var(--blue)}
  .rmain{flex:1;min-width:0;overflow:hidden}
  .rname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;gap:12px;margin-top:3px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .b-wait{background:#fef3c7;color:#92400e}
  .b-queue{background:#e5e7eb;color:#374151}
  .b-down{background:#dbeafe;color:#1e40af}
  .b-done{background:#d1fae5;color:#065f46}
  .b-err{background:#fee2e2;color:#991b1b}
  .rprog{height:3px;background:#eef0f3;border-radius:999px;margin-top:7px;overflow:hidden}
  .rprog i{display:block;height:100%;background:var(--blue);border-radius:999px}
  .racts{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .menu{height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:#4b5563;padding:0 6px;max-width:96px;cursor:pointer}
  .empty{padding:46px 16px;text-align:center;color:#9ca3af;font-size:12.5px}
  .empty b{display:block;color:#6b7280;font-size:13px;margin-bottom:4px}

  /* 업로드 */
  .up-box{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px 7px;background:#fff;transition:.15s}
  .up-box:focus-within{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .up-box textarea{flex:1 1 auto;min-height:0;width:100%;border:0;outline:none;background:transparent;resize:none;
    padding:0;font:inherit;font-size:13px;color:var(--ink)}
  .up-box textarea::placeholder{color:#9ca3af}
  .up-note{font-size:11px;color:#9ca3af;line-height:1.4;flex:0 0 auto;margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .up-note b{color:#6b7280;font-weight:600}
  .btn-primary{margin-top:12px;width:100%;height:40px;border:0;border-radius:10px;background:var(--blue);color:#fff;
    font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 1px 2px rgba(37,99,235,.35);flex:0 0 auto}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-primary svg{width:17px;height:17px}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}

  /* API */
  .api{padding:0;flex:0 0 auto}
  .api-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer}
  .api-head b{font-size:13px}
  .api-status{font-size:11.5px;color:#9ca3af;display:flex;align-items:center;gap:6px}
  .api-status.on{color:#047857;font-weight:700}
  .api-status.err{color:#b91c1c;font-weight:700}
  .api-body{padding:0 14px 13px;display:none}
  .api.open .api-body{display:block}
  .api-row{display:flex;gap:8px}
  .api input{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12.5px;outline:none;min-width:0}
  .api input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
  .api .btn{height:36px}
  .api-hint{margin-top:7px;font-size:11px;color:#9ca3af;line-height:1.5}
  .caret{width:14px;height:14px;transition:.15s;color:#9ca3af}
  .api.open .caret{transform:rotate(180deg)}

  /* 트래커 / 로그 */
  .tc-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
  .tc-left{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .tc-left svg{width:16px;height:16px;color:#7c3aed}
  .tc-meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tc-body{padding:10px 14px 14px}
  .tc-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:7px}
  .tc-row .ok{color:#10b981;font-weight:700}
  .tc-row button{border:0;background:transparent;color:#2563eb;font-weight:700;font-size:11.5px;cursor:pointer;padding:0}
  .ta{width:100%;height:92px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.55;color:#374151;outline:none;background:#fff}
  .ta:focus{border-color:#93c5fd}
  .log-card{padding:11px 14px;flex:0 0 auto;max-height:126px;overflow:auto}
  .log-card h3{margin:0 0 8px;font-size:12.5px}
  .log{font-size:11.5px;line-height:1.7;color:#4b5563}
  .log div{display:flex;gap:7px}
  .log time{color:#9ca3af;font-variant-numeric:tabular-nums}
  .log .e{color:#b91c1c}
  .log .s{color:#047857}
  .log .w{color:#b45309}

  .note{margin-top:14px;font-size:11.5px;color:#9ca3af;text-align:center}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);z-index:80;
    background:rgba(17,24,39,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:9px;
    opacity:0;pointer-events:none;transition:.18s;box-shadow:0 8px 24px rgba(16,24,40,.28);max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .ctx{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(16,24,40,.16);
    padding:5px;min-width:132px;display:none}
  .ctx button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;
    padding:7px 9px;font:inherit;font-size:12.5px;color:#374151;cursor:pointer;text-align:left}
  .ctx button:hover{background:#f3f4f6}
  .ctx button.del{color:#b91c1c}

  /* 링크 목록 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal .box{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(16,24,40,.4);max-width:760px;width:100%;
    max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .modal h3{margin:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modal .mb{padding:10px 16px;overflow:auto}
  .modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
  .fli{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f2f4;font-size:12.5px}
  .fli:last-child{border-bottom:0}
  .fli .p{flex:1;min-width:0;word-break:break-all}
  .fli .sz{color:#9ca3af;white-space:nowrap;font-variant-numeric:tabular-nums}
  .fli a,.fli button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;
    font-size:11.5px;font-weight:700;color:#374151;cursor:pointer;text-decoration:none}
  .fli a:hover,.fli button:hover{background:#f9fafb}

  body.touch .hbtn[data-act="pot"]{display:none}
  @media (pointer:coarse){ .hbtn[data-act="pot"]{display:none} }

  @media (max-width:900px){
    .grid{grid-template-columns:1fr;gap:10px}
    .col{display:contents}
    .up{order:1;height:auto}
    .folders-card{order:2;height:auto;min-height:0}
    .list-card{order:3;min-height:0}
    .tc-card{order:4}
    .log-card{order:5}
    .api{order:6}

    .c-head{display:flex}
    .card.collapsed .c-body{display:none}
    .card.collapsed{box-shadow:none;padding:0}
    .card.collapsed .c-head{padding:8px 12px}

    .folders{flex:0 0 auto;max-height:none;padding-bottom:8px}
    .rows{max-height:none}
    .up-box{min-height:96px}

    .list-head{flex-wrap:wrap;row-gap:6px;padding:10px 12px}
    .lt{flex:1 1 100%}
    .lt-sel{display:none}
    .lt-tools{width:100%;justify-content:flex-end}
    .hbtn{width:30px;height:30px}
    .sep{height:16px}
    .rmeta{gap:8px}
    .rmeta span{white-space:nowrap}
  }
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="55a026b0-94ff-4331-abac-cf9edd7b9ffc"></script>
<script src="cordova.js"></script>
<script src="sha1.js"></script>
<script src="bencode.js"></script>
<script src="src/base32.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🚀 RDMex</h1>
    <span class="tag" id="apiListSize"></span>
    <span class="tag" id="apiCombined"></span>
  </div>

  <div class="grid">
    <!-- 좌 -->
    <div class="col col-left">
      <section class="card folders-card">
        <div class="folders" id="folders"></div>
        <div class="fa-actions">
          <button class="btn" id="btnAll">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            목록
          </button>
          <button class="btn" id="btnAddFolder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            폴더 추가
          </button>
        </div>
      </section>

      <section class="card list-card" id="listCard">
        <div class="list-head" id="listHead">
          <div class="lt">
            <h2 id="listTitle">목록</h2>
            <span class="sub" id="listSub"></span>
            <span class="lt-sel" id="listSel"></span>
          </div>
          <div class="lt-tools" id="listTools">
            <button class="hbtn" data-act="pot"      data-tip="팟플레이어로 재생"></button>
            <button class="hbtn" data-act="stream"   data-tip="스트리밍으로 보기"></button>
            <button class="hbtn" data-act="rd"       data-tip="RD 페이지에서 보기"></button>
            <button class="hbtn" data-act="down"     data-tip="다운로드 링크"></button>
            <button class="hbtn" data-act="copy"     data-tip="링크 복사"></button>
            <span class="sep"></span>
            <button class="hbtn" data-act="refresh"  data-tip="새로고침"></button>
            <button class="hbtn" data-act="clean"    data-tip="완료 항목 삭제"></button>
          </div>
        </div>
        <div class="rows" id="rows"></div>
      </section>
    </div>

    <!-- 우 -->
    <div class="col col-right">
      <section class="card up" id="upCard">
        <div class="c-head" data-toggle="upCard">
          <span>마그넷 / 토렌트 추가</span>
          <span class="c-right"><span>펼치기</span>
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </div>
        <div class="c-body">
          <div class="up-box">
            <textarea id="magnetInput" placeholder="마그넷 링크를 여기에 붙여넣으세요 (여러 개는 줄바꿈)"></textarea>
            <div class="up-note" id="upNote">트래커 결합 → RD 전달 (동일 처리)</div>
          </div>
          <button class="btn-primary" id="convertUploadButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 18V6M7 11l5-5 5 5"/></svg>
            마그넷/토렌트 업로드
          </button>
          <input type="file" id="torrentFile" accept=".torrent" multiple hidden />
        </div>
      </section>

      <section class="card tc-card" id="tcCard">
        <div class="c-head" data-toggle="tcCard">
          <span>트래커</span>
          <span class="c-right"><span id="tcState"></span>
